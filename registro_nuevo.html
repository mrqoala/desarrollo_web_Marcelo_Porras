<!DOCTYPE html>
<html lang="es">
<head>
    <title>Nuevo Registro|UOC</title>
</head>
<body>

    <h1>Registro</h1>

    <form action="#" method="post">
        <p>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        </p>
        <p>
            <label for="correo">Correo Electrónico:</label><br>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@email.com" required>
        </p>
        <p>
            <label for="telefono">Teléfono:</label><br>
            <input type="number" id="telefono" name="telefono" required>
        </p>
        <p>
            <label>Direccion Postal:</label><br>
        </p>
        <p>
            <label for="region">Región:</label><br>
            <select id="region" name="region">
                <option value="arica"">Arica y Parinacota</option>
                <option value="tarapaca">Tarapacá</option>
                <option value="antofagasta">Antofagasta</option>
                <option value="atacama">Atacama</option>
                <option value="coquimbo">Coquimbo</option>
                <option value="valparaiso">Valparaiso</option>
                <option value="metropolitana">Metropolitana</option>
                <option value="libertador">Libertador General Bernardo O'higgins</option>
                <option value="maule">Maule</option>
                <option value="ñuble">Ñuble</option>
                <option value="biobio">Biobío</option>
                <option value="araucania">La Araucanía</option>
                <option value="losrios">Los Ríos</option>
                <option value="loslagos">Los Lagos</option>
                <option value="aysen">Aysen del General Carlos Ibañez del Campo</option>
                <option value="magallanes">Magallanes y la Antartica Chilena</option>
            </select>    
        </p>
        <p>
            <label for="comuna">Comuna</label>
        </p>



    </form>

</body>
</html>
