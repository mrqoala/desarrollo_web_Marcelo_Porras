<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuevo Registro | UOC</title>
    <style>
        body{font-family: sans-serif;max-width: 1400px; margin: 40px auto;}
        .inicio{font-size: 0.5em;}
        .error{color: red; font-size: 0.85em; display: none;}
        .error.visible{display: block;}
    </style>
</head>
<body>
    <a class="Inicio" href="index.html">Volver al Inicio </a>
    <h1>Registro</h1>

    <form class="formulario"  id=form-registro action="#" method="post">
        <div>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            <span class="error" id="error-nombre">Debe ingresar un nombre (mínimo 3 caracteres).</span>
        </div>
        <br>
        <div>
            <label for="correo">Correo Electrónico:</label><br>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@email.com" required>
        </div>
        <br>
        <div>
            <label for="telefono">Teléfono:</label><br>
            <input type="number" id="telefono" name="telefono" placeholder="+56XXXXXXXXX" required>
            <span class="error" id="error-telefono">Ingrese un número de Teléfono con formato válido</span>
        </div>
        <br>
        <div>
            <label>Direccion Postal:</label><br>
        </div>
        <br>
        <div>
            <label for="region">Región:</label><br>
            <select id="region" name="region">
            <option value="">--Seleccione--</option>
            </select>
            <span class="error" id="error-region">Debe Seleccionar una Región</span>    
        </div>
        <br>
        <div>
            <label for="comuna">Comuna</label><br>
            <select  id="comuna" name="comuna">
            <option value="">--Seleccione--</option>
            </select>
            <span class="error" id="error-comuna">Debe Seleccionar una Comuna</span>
        </div>
        <br>
        <button type="submit">Finalizar Registro</button>
    </form>
<script src="../js/registro.js"></script>    

</body>
</html>
